[workspace]
resolver = "2"
members = ["crates/ferrox-core", "crates/ferrox-cli", "crates/ferrox-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ferrox contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs", "signal"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "webpki-roots", "tls12"] }
webpki-roots = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
hickory-proto = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
directories = "6"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
ferrox-core = { path = "crates/ferrox-core" }

# Profils légers : pas d'infos de debug (disque limité), dépendances optimisées.
[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
