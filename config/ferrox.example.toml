[proxy]
enabled = true
listen = "127.0.0.1:3128"
connect_timeout_ms = 8000
idle_timeout_s = 300

[dns]
enabled = true
listen = "127.0.0.1:5335"
upstreams = [
    "1.1.1.1:53",
    "9.9.9.9:53",
]
block_mode = "nxdomain"
cache_entries = 20000
timeout_ms = 2000

[tls]
mitm = false
bypass = [
    "apple.com",
    "icloud.com",
    "windowsupdate.com",
    "update.microsoft.com",
]

[filter]
custom_block = []
allow = []
blocked_categories = []
blocked_extensions = []
blocked_mime = []
sniff_magic = true

[[filter.lists]]
name = "urlhaus"
url = "https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-hosts.txt"
category = "malware"
enabled = true

[[filter.lists]]
name = "phishing-army"
url = "https://phishing.army/download/phishing_army_blocklist.txt"
category = "phishing"
enabled = true

[[filter.lists]]
name = "stevenblack"
url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
category = "ads"
enabled = false

[detect.beacon]
enabled = true
min_events = 8
max_cv = 0.15
min_interval_s = 4.0
max_interval_s = 3600.0
ignore = []

[detect.exfil]
enabled = true
single_upload_mb = 20.0
window_s = 300
window_upload_mb = 100.0
ratio = 10.0
ratio_min_mb = 5.0

[detect.user_agent]
enabled = true
suspicious = [
    "curl/",
    "wget/",
    "python-requests",
    "python-urllib",
    "aiohttp",
    "go-http-client",
    "powershell",
    "winhttp",
    "libwww-perl",
    "nikto",
    "sqlmap",
    "nmap",
    "masscan",
    "zgrab",
    "msie 6.0",
    "certutil",
    "bitsadmin",
    "java/",
]
max_distinct = 6
alert_empty = true

[detect.dns]
enabled = true
entropy_threshold = 3.5
min_label_len = 12
max_qname_len = 100
max_label_len = 50
txt_per_min = 30
unique_sub_per_min = 60
nx_ratio = 0.5
nx_min = 20

[log]
jsonl = true

[ui]
theme = "dark"
